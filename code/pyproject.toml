[project]
name = "ramscore"
version = "0.2.0"
description = "Label-efficient, imbalance-aware, and domain-robust joint-level SvdH erosion grading (Master's Thesis RQ0-RQ6)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.5",
    "timm>=1.0",
    "albumentations>=1.4",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "tqdm>=4.66",
]

[dependency-groups]
analysis = [
    "matplotlib>=3.9",
    "statsmodels>=0.14",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
